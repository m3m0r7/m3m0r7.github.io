<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=M+PLUS+1+Code:wght@400;500;600;700&amp;family=Orbitron:wght@600;700;800&amp;family=Share+Tech+Mono&amp;display=swap"
  >
  <title>Hi! I am memory</title>
  <style>
    :root {
      color-scheme: light;
      --accent: #a6304e;
      --accent-bright: #d45570;
      --ink: #241e26;
      --muted: #6d686e;
      --paper: #fcefe0;
      --spinner-size: min(76vw, calc(100svh - 14rem), 40rem);
      --profile-sticky-height: 0px;
      --system-mono-font: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Monaco,
        "Cascadia Mono", "Roboto Mono", "Noto Sans Mono CJK JP", "Noto Sans JP", monospace;
      --terminal-font: var(--system-mono-font);
      --archive-font: "IBM Plex Mono", "M PLUS 1 Code", var(--system-mono-font);
      --game-ui-font: "Share Tech Mono", var(--terminal-font);
      --game-score-font: "Share Tech Mono", var(--terminal-font);
      --game-heading-font: "Orbitron", var(--terminal-font);
      --game-countdown-font: "IBM Plex Mono", "M PLUS 1 Code", var(--system-mono-font);
      --game-score-color: #746b71;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
    }

    body.is-archive {
      --terminal-font: var(--archive-font);
    }

    html.is-archive {
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }

    html.is-archive body {
      overflow: visible;
    }

    main {
      display: grid;
      width: 100vw;
      min-height: 100vh;
      min-height: 100svh;
      padding-bottom: clamp(7.5rem, 15svh, 10rem);
      place-items: center;
      isolation: isolate;
    }

    body.is-archive main {
      padding-bottom: 0;
      place-items: start center;
    }

    .stage {
      display: grid;
      gap: clamp(1.5rem, 3.2svh, 2rem);
      justify-items: center;
    }

    .profile-overview {
      position: relative;
      display: grid;
      gap: clamp(1.5rem, 3.2svh, 2rem);
      justify-items: center;
    }

    .rotate-hint {
      position: absolute;
      z-index: 2;
      top: clamp(-2.25rem, -2.7svh, -1.5rem);
      right: clamp(-4rem, -3.5vw, -1rem);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      font-family: var(--terminal-font);
      font-size: clamp(0.66rem, 0.9vw, 0.8rem);
      font-weight: 600;
      letter-spacing: 0.07em;
      line-height: 1;
      pointer-events: none;
      text-transform: uppercase;
      transform: rotate(3deg);
      transition: opacity 100ms ease;
      white-space: nowrap;
    }

    .rotate-hint-arrow {
      color: var(--accent);
      font-size: 1.4em;
      line-height: 1;
    }

    body.is-archive .rotate-hint {
      display: none;
    }

    body.is-archive .stage {
      width: min(76rem, calc(100% - clamp(2rem, 7vw, 7rem)));
      padding: 0;
      gap: clamp(2rem, 5vw, 4.5rem);
      justify-items: stretch;
    }

    body.is-archive .profile-overview {
      position: sticky;
      z-index: 7;
      top: 0;
      width: 100%;
      grid-template-columns: clamp(6rem, 8vw, 7.5rem) minmax(0, 1fr);
      align-items: center;
      gap: clamp(1.5rem, 3.4vw, 3rem);
      justify-items: start;
      padding:
        clamp(1.15rem, 2.2vw, 1.5rem)
        0
        clamp(1.3rem, 2.4vw, 1.7rem);
      background: #fff;
    }

    body.is-archive .profile-overview::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--ink), var(--accent) 52%, transparent);
      content: "";
      opacity: 0.38;
    }

    .spinner {
      display: grid;
      width: var(--spinner-size);
      height: var(--spinner-size);
      margin: 0;
      padding: 0;
      place-items: center;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      cursor: grab;
      filter: drop-shadow(0 1.5rem 1.75rem rgb(86 48 62 / 19%));
      transform: rotate(var(--rotation, 0rad));
      transform-origin: center;
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      transition:
        width 280ms cubic-bezier(0.22, 0.7, 0.18, 1),
        height 280ms cubic-bezier(0.22, 0.7, 0.18, 1),
        filter 180ms ease;
      will-change: transform;
      contain: paint;
    }

    body.is-archive .spinner {
      width: clamp(6rem, 8vw, 7.5rem);
      height: clamp(6rem, 8vw, 7.5rem);
    }

    .spinner.is-dragging {
      cursor: grabbing;
    }

    .spinner.is-profile {
      cursor: default;
      filter: drop-shadow(0 1.15rem 1.5rem rgb(86 48 62 / 16%));
    }

    .spinner:focus-visible {
      border-radius: 50%;
      outline: 0.2rem solid rgb(181 58 85 / 72%);
      outline-offset: 0.65rem;
    }

    .ascii-art {
      display: block;
      width: 96.491228%;
      height: auto;
      aspect-ratio: 880 / 912;
      pointer-events: none;
      opacity: 1;
      transform: scale(1);
      transition:
        opacity 140ms ease,
        transform 200ms cubic-bezier(0.22, 0.7, 0.18, 1);
    }

    .ascii-art.is-morphing {
      opacity: 0.62;
      transform: scale(0.965);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      border: 0;
      margin: -1px;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      overflow: hidden;
      white-space: nowrap;
    }

    .identity {
      text-align: center;
      font-family: var(--terminal-font);
    }

    body.is-archive .identity {
      text-align: left;
    }

    body.is-archive .profile-name {
      font-size: clamp(1.35rem, 2vw, 1.85rem);
    }

    body.is-archive .profile-email {
      margin-top: 0.5rem;
      font-size: clamp(0.88rem, 1.2vw, 1.08rem);
    }

    .profile-name,
    .profile-email {
      margin: 0;
      background: linear-gradient(140deg, #241e26 0%, #a6304e 58%, #c23c58 100%);
      background-clip: text;
      color: transparent;
      transition: opacity 100ms ease;
      -webkit-background-clip: text;
    }

    .profile-name {
      font-size: clamp(1.6rem, 3.2vw, 2.25rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.2;
    }

    .profile-email {
      margin-top: clamp(0.45rem, 1svh, 0.65rem);
      font-family: var(--game-ui-font);
      font-size: clamp(1rem, 1.7vw, 1.5rem);
      line-height: 1.3;
    }

    .profile-email::after {
      content: "@gmail.com";
    }

    .profile-byline {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      margin: 1.25rem 0 0;
      align-items: center;
      gap: 0.5rem;
      padding: 0.42rem 0.65rem;
      border: 1px solid rgb(166 48 78 / 58%);
      background: rgb(166 48 78 / 5%);
      box-shadow: 0.18rem 0.18rem 0 rgb(36 30 38 / 16%);
      color: var(--accent);
      font-family: var(--terminal-font);
      font-size: clamp(0.72rem, 1.15vw, 0.88rem);
      font-weight: 650;
      letter-spacing: 0.11em;
      line-height: 1.2;
      text-decoration: none;
      text-transform: uppercase;
      transition:
        background 140ms ease,
        box-shadow 140ms ease,
        color 140ms ease,
        opacity 100ms ease,
        transform 140ms ease;
    }

    body.is-archive .profile-byline {
      display: inline-flex;
      margin-top: 0.85rem;
      font-size: clamp(0.65rem, 0.9vw, 0.76rem);
    }

    .profile-byline-icon {
      width: 1rem;
      height: 1rem;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
      transition: transform 140ms ease;
    }

    .profile-byline:hover {
      background: var(--accent);
      box-shadow: 0.24rem 0.24rem 0 rgb(36 30 38 / 24%);
      color: #fff;
      transform: translate(-0.08rem, -0.08rem);
    }

    .profile-byline:hover .profile-byline-icon {
      transform: translateX(0.18rem);
    }

    .profile-byline:active {
      box-shadow: none;
      transform: translate(0.1rem, 0.1rem);
    }

    .game-start-hint {
      appearance: none;
      position: fixed;
      z-index: 3;
      bottom: clamp(7.75rem, 13.3svh, 8.5rem);
      left: 50%;
      width: max-content;
      max-width: calc(100vw - 2rem);
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: default;
      font-family: var(--terminal-font);
      font-size: clamp(0.58rem, 0.9vw, 0.72rem);
      font-weight: 500;
      letter-spacing: 0.07em;
      line-height: 1.4;
      clip-path: inset(0 100% 0 0);
      pointer-events: none;
      text-transform: uppercase;
      transform: translateX(-50%);
      animation:
        game-start-hint-reveal 1s cubic-bezier(0.16, 1, 0.3, 1) 5s forwards,
        game-start-hint-blink 1.5s steps(1, end) 6s infinite;
    }

    .game-start-hint:focus-visible {
      outline: 0.12rem solid rgb(166 48 78 / 72%);
      outline-offset: 0.18rem;
    }

    body.is-archive .game-start-hint {
      display: none;
    }

    body.is-game-mode .game-start-hint {
      animation: none;
      clip-path: inset(0);
      visibility: hidden;
    }

    @keyframes game-start-hint-reveal {
      from {
        clip-path: inset(0 100% 0 0);
      }

      to {
        clip-path: inset(0);
      }
    }

    @keyframes game-start-hint-blink {
      0%,
      62% {
        visibility: visible;
      }

      63%,
      100% {
        visibility: hidden;
      }
    }

    @keyframes game-start-hint-touch-blink {
      0%,
      62% {
        opacity: 1;
      }

      63%,
      100% {
        opacity: 0.18;
      }
    }

    .archive {
      display: none;
      width: 100%;
      color: var(--ink);
      font-family: var(--terminal-font);
      opacity: 0;
      transform: translateY(1.4rem);
      transition:
        opacity 180ms ease,
        transform 240ms cubic-bezier(0.22, 0.7, 0.18, 1);
    }

    body.is-archive .archive {
      display: grid;
      gap: 0;
    }

    body.is-archive .archive.is-ready {
      opacity: 1;
      transform: translateY(0);
    }

    .archive-heading {
      display: grid;
      max-width: 47rem;
      gap: 0.75rem;
    }

    .archive-title {
      margin: 0;
      font-size: clamp(1.8rem, 3.8vw, 3rem);
      font-weight: 650;
      letter-spacing: 0.06em;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .archive-layout {
      display: grid;
      grid-template-columns: minmax(18rem, 0.78fr) minmax(0, 1.22fr);
      align-items: start;
      gap: clamp(2rem, 5vw, 5rem);
    }

    .archive-sidebar {
      position: sticky;
      z-index: 3;
      top: calc(var(--profile-sticky-height) + clamp(1rem, 2vw, 1.5rem));
      display: grid;
      align-self: start;
      gap: clamp(2rem, 4vw, 3.25rem);
      padding-bottom: 0.25rem;
      background: #fff;
    }

    .archive-index {
      --archive-active-index: 0;
      --archive-active-column: 0;
      --archive-active-row: 0;

      position: relative;
      isolation: isolate;
      border-top: 1px solid rgb(36 30 38 / 30%);
    }

    .archive-index::before {
      position: absolute;
      z-index: 0;
      top: 1px;
      left: 0;
      width: 100%;
      height: calc((100% - 1px) / 6);
      background: linear-gradient(90deg, rgb(166 48 78 / 11%), rgb(166 48 78 / 3%) 72%, transparent);
      box-shadow:
        inset 2px 0 0 var(--accent),
        inset 0 -1px 0 rgb(166 48 78 / 28%);
      clip-path: polygon(0 0, calc(100% - 0.65rem) 0, 100% 0.65rem, 100% 100%, 0 100%);
      content: "";
      pointer-events: none;
      transform: translateY(calc(var(--archive-active-index) * 100%));
      transition: transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .archive-tab {
      --reveal-delay: 0ms;

      position: relative;
      display: grid;
      width: 100%;
      grid-template-columns: 1.5rem minmax(0, 1fr);
      align-items: center;
      gap: clamp(0.75rem, 2vw, 1rem);
      padding: 1.15rem 1rem;
      border: 0;
      border-bottom: 1px solid rgb(36 30 38 / 24%);
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      opacity: 0;
      text-align: left;
      transform: translateX(-1rem);
      transition:
        color 180ms ease,
        opacity 160ms ease var(--reveal-delay),
        transform 220ms cubic-bezier(0.22, 0.7, 0.18, 1) var(--reveal-delay);
      -webkit-tap-highlight-color: transparent;
    }

    .archive.is-ready .archive-tab {
      opacity: 1;
      transform: translateX(0);
    }

    .archive-tab > span {
      position: relative;
      z-index: 1;
    }

    .archive-tab:is(:hover, [aria-selected="true"]) {
      color: var(--accent);
    }

    .archive-tab:focus-visible,
    .archive-action:focus-visible,
    .archive-item-link:focus-visible,
    .profile-byline:focus-visible {
      outline: 0.18rem solid rgb(181 58 85 / 72%);
      outline-offset: 0.24rem;
    }

    .archive-tab-number {
      font-family: var(--terminal-font);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }

    .archive-tab-copy {
      display: grid;
      gap: 0.2rem;
    }

    .archive-tab-label {
      font-size: clamp(1rem, 2vw, 1.35rem);
      font-weight: 720;
      letter-spacing: 0.06em;
      transition: letter-spacing 360ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .archive-tab[aria-selected="true"] .archive-tab-label {
      letter-spacing: 0.11em;
    }

    .archive-panel {
      min-width: 0;
      padding-bottom: clamp(15rem, 24svh, 19rem);
    }

    .archive-panel-heading {
      display: none;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid rgb(36 30 38 / 30%);
    }

    .archive-panel-title,
    .archive-empty,
    .archive-error {
      margin: 0;
    }

    .archive-panel-title {
      font-family: var(--terminal-font);
      font-size: clamp(0.9rem, 1.5vw, 1rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .archive-list {
      display: grid;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .archive-groups {
      display: grid;
      gap: clamp(1.35rem, 3vw, 2rem);
    }

    .archive-group {
      border-top: 1px solid rgb(36 30 38 / 28%);
    }

    .archive-group-summary {
      display: grid;
      min-width: 0;
      grid-template-columns: 0.65rem minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 0;
      color: var(--ink);
      cursor: pointer;
      list-style: none;
      transition: color 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .archive-group-summary::-webkit-details-marker {
      display: none;
    }

    .archive-group-summary:is(:hover, :focus-visible),
    .archive-group[open] > .archive-group-summary {
      color: var(--accent);
    }

    .archive-group-summary:focus-visible {
      outline: 0.18rem solid rgb(181 58 85 / 72%);
      outline-offset: 0.24rem;
    }

    .archive-group-marker {
      width: 0.46rem;
      aspect-ratio: 1;
      border-right: 0.11rem solid currentColor;
      border-bottom: 0.11rem solid currentColor;
      transform: translateY(-0.1rem) rotate(45deg);
      transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .archive-group[open] > .archive-group-summary .archive-group-marker {
      transform: translateY(0.12rem) rotate(225deg);
    }

    .archive-group-title,
    .archive-group-count {
      font-family: var(--terminal-font);
      font-variant-numeric: tabular-nums;
      text-transform: uppercase;
    }

    .archive-group-title {
      min-width: 0;
      font-size: clamp(0.8rem, 1.4vw, 0.95rem);
      font-weight: 720;
      letter-spacing: 0.085em;
      line-height: 1.4;
    }

    .archive-group-count {
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      line-height: 1;
      white-space: nowrap;
    }

    .archive-group > .archive-list {
      padding-left: clamp(0.75rem, 2vw, 1.2rem);
      border-left: 1px solid rgb(166 48 78 / 22%);
    }

    .archive-item {
      display: grid;
      grid-template-columns: minmax(5.5rem, 0.26fr) minmax(0, 1fr);
      align-items: first baseline;
      gap: clamp(1rem, 2.5vw, 2rem);
      padding: 1.25rem 0;
      border-bottom: 1px solid rgb(36 30 38 / 16%);
      contain-intrinsic-block-size: auto 7rem;
      content-visibility: auto;
    }

    .archive-item[data-kind="book"] {
      align-items: start;
    }

    .archive-item-date,
    .archive-item-title,
    .archive-item-detail,
    .archive-item-tags {
      margin: 0;
    }

    .archive-item-date {
      padding-top: 0;
      color: var(--accent);
      font-family: var(--terminal-font);
      font-size: 0.7rem;
      letter-spacing: 0.055em;
      line-height: 1.55;
    }

    .archive-item-body {
      display: grid;
      min-width: 0;
      gap: 0.45rem;
    }

    .archive-item-title,
    .archive-item-link {
      color: var(--ink);
      font-size: clamp(0.95rem, 1.55vw, 1.08rem);
      font-weight: 680;
      line-height: 1.55;
    }

    .archive-item-link {
      display: inline;
      text-decoration-color: rgb(166 48 78 / 36%);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.28em;
      transition: color 160ms ease, text-decoration-color 160ms ease;
    }

    .archive-item-link:hover {
      color: var(--accent);
      text-decoration-color: currentColor;
    }

    .archive-item-detail {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.65;
    }

    .archive-position-list {
      display: grid;
      gap: 0.35rem;
      margin: 0.15rem 0 0;
      padding: 0;
      list-style: none;
    }

    .archive-position {
      display: grid;
      grid-template-columns: minmax(7rem, auto) minmax(0, 1fr);
      align-items: first baseline;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.6;
    }

    .archive-position-period,
    .archive-item-tags {
      font-family: var(--terminal-font);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
    }

    .archive-item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.2rem;
      padding: 0;
      line-height: 1;
      list-style: none;
      text-transform: uppercase;
    }

    .archive-tag {
      --tag-background: rgb(36 30 38 / 6%);
      --tag-border: rgb(36 30 38 / 19%);
      --tag-color: var(--ink);

      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.32rem 0.48rem;
      border: 1px solid var(--tag-border);
      background: var(--tag-background);
      color: var(--tag-color);
      font-size: 0.64rem;
      font-weight: 650;
      letter-spacing: 0.06em;
    }

    .archive-tag::before {
      width: 0.32rem;
      aspect-ratio: 1;
      background: currentColor;
      content: "";
    }

    .archive-tag[data-tone="tech"] {
      --tag-background: rgb(166 48 78 / 9%);
      --tag-border: rgb(166 48 78 / 27%);
      --tag-color: #8f2943;
    }

    .archive-tag[data-tone="business"] {
      --tag-background: rgb(199 157 47 / 13%);
      --tag-border: rgb(138 106 24 / 29%);
      --tag-color: #775b10;
    }

    .archive-tag[data-tone="writing"] {
      --tag-background: rgb(212 85 112 / 10%);
      --tag-border: rgb(194 60 88 / 25%);
      --tag-color: #a6304e;
    }

    .archive-tag[data-tone="play"] {
      --tag-background: rgb(245 187 178 / 26%);
      --tag-border: rgb(178 58 83 / 25%);
      --tag-color: #823347;
    }

    .archive-tag[data-tone="muted"] {
      --tag-background: rgb(109 104 110 / 8%);
      --tag-border: rgb(109 104 110 / 22%);
      --tag-color: #5c575d;
    }

    .archive-item[data-kind="book"] .archive-item-body {
      grid-template-columns: clamp(4.75rem, 8vw, 6rem) minmax(0, 1fr);
      column-gap: clamp(0.85rem, 2vw, 1.2rem);
    }

    .archive-item[data-kind="book"] .archive-item-body > :not(.archive-book-cover) {
      grid-column: 2;
    }

    .archive-book-cover {
      width: 100%;
      grid-row: 1 / span 4;
      border: 1px solid rgb(36 30 38 / 14%);
      background: #fff;
      box-shadow: 0.22rem 0.3rem 0 rgb(36 30 38 / 10%);
      object-fit: cover;
    }

      transform: translateY(-0.38rem) scale(1.14);
    }

    .social-link:active {
      transform: translateY(0) scale(0.94);
    }

    .social-link:focus-visible {
      outline: 0.18rem solid rgb(181 58 85 / 72%);
      outline-offset: 0.22rem;
    }

    @media (min-width: 48rem) and (hover: hover) and (pointer: fine) {
      .social-link::before {
        position: absolute;
        bottom: calc(100% + 0.65rem);
        left: 50%;
        padding: 0.46rem 0.68rem 0.48rem;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 0.58rem 0.58rem 0.58rem 0.2rem;
        background: linear-gradient(145deg, rgb(15 13 16 / 84%), rgb(55 38 46 / 70%));
        box-shadow:
          0 0.65rem 1.35rem rgb(36 30 38 / 22%),
          inset 0 1px 0 rgb(255 255 255 / 12%);
        color: #fff;
        content: attr(data-label);
        font-family: var(--terminal-font);
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.015em;
        line-height: 1;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 0.35rem) scale(0.94);
        transition: opacity 160ms ease, transform 220ms ease;
        white-space: nowrap;
        -webkit-backdrop-filter: blur(0.75rem) saturate(125%);
        backdrop-filter: blur(0.75rem) saturate(125%);
      }

      .social-link::after {
        position: absolute;
        bottom: calc(100% + 0.18rem);
        left: 50%;
        width: 0.72rem;
        height: 0.5rem;
        background: rgb(30 24 28 / 80%);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        content: "";
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 0.35rem) scale(0.86);
        transform-origin: top;
        transition: opacity 160ms ease, transform 220ms ease;
      }

      .social-link:is(:hover, :focus-visible)::before,
      .social-link:is(:hover, :focus-visible)::after {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    .social-icon {
      width: 62.5%;
      height: 62.5%;
      overflow: visible;
    }

    .profile-dock-icon {
      grid-area: 1 / 1;
      width: 84%;
      height: 84%;
      border-radius: 50%;
      opacity: 1;
      transform: rotate(0) scale(1);
      transition: opacity 180ms ease, transform 280ms cubic-bezier(0.2, 0.8, 0.2, 1.15);
    }

    .profile-back-icon {
      grid-area: 1 / 1;
      width: 52%;
      height: 52%;
      color: var(--paper);
      opacity: 0;
      transform: rotate(24deg) scale(0.65);
      transition: opacity 180ms ease, transform 280ms cubic-bezier(0.2, 0.8, 0.2, 1.15);
    }

    .profile-back-icon path {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.2;
    }

    body.is-archive .profile-dock-icon {
      opacity: 0;
      transform: rotate(-24deg) scale(0.65);
    }

    body.is-archive .profile-back-icon {
      opacity: 1;
      transform: rotate(0) scale(1);
    }

    .social-icon path {
      fill: #fcefe0;
    }

    .social-gradient-definition {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    @media (max-width: 56rem) {
      .archive-layout {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .archive-sidebar {
        display: contents;
      }

      .archive-index {
        position: sticky;
        z-index: 4;
        top: var(--profile-sticky-height);
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border-top: 0;
        border-bottom: 1px solid rgb(36 30 38 / 28%);
        background: #fff;
      }

      .archive-index::before {
        top: 0;
        width: calc(100% / 3);
        height: 50%;
        background: linear-gradient(180deg, rgb(166 48 78 / 9%), rgb(166 48 78 / 3%));
        box-shadow: inset 0 -2px 0 var(--accent);
        clip-path: polygon(0 0, calc(100% - 0.4rem) 0, 100% 0.4rem, 100% 100%, 0 100%);
        transform: translate(
          calc(var(--archive-active-column) * 100%),
          calc(var(--archive-active-row) * 100%)
        );
      }

      .archive-tab {
        width: auto;
        min-width: 0;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        justify-items: center;
        gap: 0.35rem;
        padding: 0.9rem 0.2rem 0.8rem;
        border-right: 1px solid rgb(36 30 38 / 12%);
        border-bottom: 0;
        text-align: center;
      }

      .archive-tab:nth-child(-n + 3) {
        border-bottom: 1px solid rgb(36 30 38 / 12%);
      }

      .archive-tab:nth-child(3n) {
        border-right: 0;
      }

      .archive-tab-number {
        display: none;
      }

      .archive-tab-copy {
        display: block;
        min-width: 0;
      }

      .archive-tab-label {
        font-size: clamp(0.66rem, 2.45vw, 0.82rem);
        letter-spacing: 0.025em;
      }

      .archive-tab[aria-selected="true"] .archive-tab-label {
        letter-spacing: 0.045em;
      }

      body.is-archive .profile-overview {
        grid-template-columns: 5.25rem minmax(0, 1fr);
        gap: 1.25rem;
        padding: 0.9rem 0 1.05rem;
      }

      body.is-archive .spinner {
        width: 5.25rem;
        height: 5.25rem;
      }

      body.is-archive .profile-byline {
        margin-top: 0.7rem;
        padding: 0.3rem 0.45rem;
        font-size: 0.58rem;
        line-height: 1;
      }
    }

    @media (max-width: 30rem) {
      :root {
        --spinner-size: min(72vw, calc(100svh - 13rem));
      }

      body.is-archive .stage {
        width: calc(100% - 2rem);
      }

      body.is-archive .profile-overview {
        grid-template-columns: 4.4rem minmax(0, 1fr);
        gap: 1rem;
        justify-items: start;
        padding: 0.8rem 0 0.95rem;
      }

      body.is-archive .identity {
        min-width: 0;
        text-align: left;
      }

      body.is-archive .spinner {
        width: 4.4rem;
        height: 4.4rem;
      }

      body.is-archive .profile-name {
        font-size: 1.08rem;
        letter-spacing: 0.05em;
      }

      body.is-archive .profile-email {
        overflow: hidden;
        font-size: clamp(0.68rem, 3.4vw, 0.82rem);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .profile-byline {
        max-width: 27rem;
      }

      .rotate-hint {
        top: -3.1rem;
        right: 1.25rem;
        font-size: 0.58rem;
        transform: rotate(2deg);
      }

      .game-start-hint {
        bottom: 14.75svh;
      }

      .archive-title {
        font-size: clamp(2rem, 10vw, 3rem);
      }

      .archive-item {
        grid-template-columns: 1fr;
        gap: 0.4rem;
      }

      .archive-item-date {
        padding-top: 0;
      }

      .archive-position {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }

    @media (max-width: 40rem) {
      .social-links {
        --dock-space: clamp(0.35rem, 1.5vw, 0.5rem);
      }

      .social-link {
        width: clamp(2.75rem, 13vw, 3.25rem);
      }
    }

    @media (max-width: 21.25rem) {
      .social-links {
        --dock-space: 0.35rem;
      }

      .social-link {
        width: 2.75rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .archive,
      .archive-group-marker,
      .archive-group-summary,
      .archive-index::before,
      .archive-tab,
      .ascii-art,
      .profile-name,
      .profile-email,
      .profile-byline,
      .profile-byline-icon,
      .game-start-hint,
      .rotate-hint,
      .game-over-action,
      .game-controls,
      .spinner,
      .social-link,
      .profile-back-icon,
      .profile-dock-icon,
      .game-countdown-track::before,
      .social-link::before,
      .social-link::after {
        transition: none;
      }

      .game-start-hint,
      .archive-loading-line,
      .game-countdown-number.is-ticking,
      body.is-game-mode .social-links.is-game-hit::after {
        animation: none;
      }

      .game-start-hint {
        clip-path: inset(0);
        visibility: visible;
      }
    }
  </style>
</head>

      for (let column = 0; column < GRID_WIDTH; column += 1) {
        const colorIndex = COLOR_ALPHABET.indexOf(colorRows[row][column]);
        const [foreground, background] = colorPairs[colorIndex];
        const character = characters[column];

        portraitCells.push({ character, foreground, background });
      }
    }

    const renderCharacter = (canvas, hiddenCells = null, fontFamily = "") => {
      const context = canvas.getContext("2d");

      if (!context) return;

      const cellWidth = 10;
      const cellHeight = 19;
      const sourceWidth = GRID_WIDTH * cellWidth;
      const sourceHeight = GRID_HEIGHT * cellHeight;
      const terminalFont = fontFamily || getComputedStyle(document.documentElement)
        .getPropertyValue("--terminal-font");

      context.clearRect(0, 0, canvas.width, canvas.height);
      context.setTransform(
        canvas.width / sourceWidth,
        0,
        0,
        canvas.height / sourceHeight,
        0,
        0,
      );
      context.imageSmoothingEnabled = false;
      context.font = `18px ${terminalFont}`;
      context.textAlign = "center";
      context.textBaseline = "middle";

      portraitCells.forEach(({ character, foreground, background }, index) => {
        if (hiddenCells?.has(index)) return;

        const column = index % GRID_WIDTH;
        const row = Math.floor(index / GRID_WIDTH);
        const x = column * cellWidth;
        const y = row * cellHeight;

        if (background) {
          context.fillStyle = background;
          context.fillRect(x, y, cellWidth, cellHeight);
        }
        if (foreground && character !== " ") {
          context.fillStyle = foreground;
          context.fillText(character, x + cellWidth / 2, y + cellHeight / 2);
        }
      });

      context.setTransform(1, 0, 0, 1, 0, 0);
    };

    const copyCharacter = (source, target) => {
      const context = target.getContext("2d");

      if (!context) return;

      context.clearRect(0, 0, target.width, target.height);
      context.imageSmoothingEnabled = false;
      context.drawImage(source, 0, 0, target.width, target.height);

    const createElement = (tagName, className, textContent) => {

      if (textContent !== undefined) element.textContent = textContent;
      return element;
    };

    const localizedText = (value) => {
      if (typeof value === "string") return value;
      if (!value || typeof value !== "object") return "";
      return value.en || value.ja || "";
    };

    const safeExternalUrl = (value) => {
      try {
        const url = new URL(value, window.location.href);
        return url.protocol === "https:" || url.protocol === "http:" ? url.href : "";
      } catch {
        return "";
      }
    };

    const formatArchiveDate = (value) => {
      const date = new Date(value);

      if (Number.isNaN(date.getTime())) return String(value || "");
      return archiveDateFormatter.format(date).replaceAll("/", ".");
    };

    const archiveYear = (value) => {
      const match = formatArchiveDate(value).match(/^\d{4}/);

      if (!match) throw new Error(`Invalid archive date: ${String(value)}`);
      return match[0];
    };

    const monthIndex = (value) => {
      const match = String(value || "").match(/^(\d{4})[/-](\d{1,2})/);
      return match ? Number(match[1]) * 12 + Number(match[2]) - 1 : null;
    };

    const formatMonthIndex = (value) => (
      value === null
        ? ""
        : `${Math.floor(value / 12)}.${String(value % 12 + 1).padStart(2, "0")}`
    );

    const experiencePeriod = (positions) => {
      const starts = positions.map((position) => monthIndex(position.start)).filter(Number.isFinite);
      const ends = positions.map((position) => monthIndex(position.end)).filter(Number.isFinite);

      if (starts.length === 0) return "";
      const start = Math.min(...starts);
      const end = positions.some((position) => position.end === null)
        ? "PRESENT"
        : formatMonthIndex(Math.max(...ends));
      return `${formatMonthIndex(start)} — ${end}`;
    };

    const requestJson = async (path) => {
      const response = await fetch(path);

      if (!response.ok) throw new Error(`Failed to load ${path}: ${response.status}`);
      return response.json();
    };

    const normalizeArchiveData = ([profile, activities, articles, works]) => {
      if (
        !Array.isArray(profile.experiences)
        || !Array.isArray(profile.books)
        || !Array.isArray(activities)
        || !Array.isArray(articles.posts)
        || !Array.isArray(works)
      ) {
        throw new Error("Profile data has an unexpected structure.");
      }

      const career = profile.experiences.map((experience) => {
        const positions = Array.isArray(experience.positions) ? experience.positions : [];
        const periodSource = positions.length > 0
          ? positions
          : experience.period && typeof experience.period === "object"
            ? [experience.period]
            : [];
        const groupLabel = EMPLOYMENT_GROUPS[experience.employment_type];
        const detail = localizedText(experience.description);

        if (!groupLabel) {
          throw new Error(`Invalid employment type: ${String(experience.employment_type)}`);
        }
        if (periodSource.length === 0 && !detail) {
          throw new Error(`Missing career period or description: ${localizedText(experience.name)}`);
        }

        return {
          groupKey: experience.employment_type,
          groupLabel,
          date: periodSource.length > 0 ? experiencePeriod(periodSource) : "",
          title: localizedText(experience.name),
          detail,
          positions: positions.map((position) => ({
            period: `${String(position.start).replaceAll("/", ".")} — ${
              position.end === null ? "PRESENT" : String(position.end).replaceAll("/", ".")
            }`,
            title: localizedText(position.name),
          })),
        };
      });

      const talks = activities
        .filter((activity) => Array.isArray(activity.tags) && activity.tags.includes("Talk"))
        .sort((left, right) => Date.parse(right.published_at) - Date.parse(left.published_at))
        .map((activity) => {
          const year = archiveYear(activity.published_at);

          return {
            groupKey: year,
            groupLabel: year,
            date: formatArchiveDate(activity.published_at),
            title: activity.title,
            detail: activity.location,
            link: safeExternalUrl(activity.url),
            tags: activity.tags.filter((tag) => tag !== "Talk"),
          };
        });

      const oss = activities
        .filter((activity) => Array.isArray(activity.tags) && activity.tags.includes("OSS"))
        .sort((left, right) => Date.parse(right.published_at) - Date.parse(left.published_at))
        .map((activity) => {
          const language = String(activity.language || "").trim();

          if (!language) throw new Error(`Missing OSS language: ${String(activity.title)}`);
          return {
            groupKey: language,
            groupLabel: language,
            date: formatArchiveDate(activity.published_at),
            title: activity.title,
            detail: activity.description,
            link: safeExternalUrl(activity.url),
            tags: activity.tags.filter((tag) => tag !== "OSS"),
          };
        });

      const normalizedArticles = articles.posts
        .filter((post) => post.visibility === "ANYONE")
        .map((post) => {
          const year = archiveYear(post.createdAt);

          return {
            groupKey: year,
            groupLabel: year,
            date: formatArchiveDate(post.createdAt),
            sortDate: Date.parse(post.createdAt),
            title: post.title,
            detail: `sizu.me / ${Number(post.bodyCharacterCount).toLocaleString("en-US")} chars`,
            link: safeExternalUrl(`https://sizu.me/memory/posts/${encodeURIComponent(post.slug)}`),
            tags: ["Article", ...(Array.isArray(post.tags) ? post.tags : [])],
          };
        })
        .sort((left, right) => right.sortDate - left.sortDate);
      const books = profile.books.flatMap((book) => (
        Array.isArray(book.authors) ? book.authors.map((publication) => {
          const year = archiveYear(publication.published_at);

          return {
            kind: "book",
            groupKey: year,
            groupLabel: year,
            date: formatArchiveDate(publication.published_at),
            sortDate: Date.parse(publication.published_at),
            title: localizedText(publication.title),
            detail: localizedText(book.publisher),
            link: safeExternalUrl(publication.link),
            tags: Array.isArray(publication.tags) ? publication.tags : [],
            image: publication.image
              ? `./assets/books/${encodeURIComponent(String(publication.image).split("/").pop())}`
              : "",
          };
        }) : []
      )).sort((left, right) => right.sortDate - left.sortDate);

      const products = works.map((work) => {

        return {
          kind: "product",
          date: "PRODUCT",
          title: work.title,
          detail: work.description,
          link: safeExternalUrl(work.url),
          tags: Array.isArray(work.tags) ? work.tags.filter((tag) => tag !== "Work") : [],

      if (["business", "career", "culture", "panel discussion"].includes(normalizedTag)) {

    const createArchiveGroups = (items, categoryConfig) => {
      const groupMap = new Map();

      items.forEach((item) => {
        if (!item.groupKey || !item.groupLabel) {
          throw new Error(`Missing archive group: ${String(item.title)}`);
        }
        if (!groupMap.has(item.groupKey)) {
          groupMap.set(item.groupKey, {
            key: item.groupKey,
            label: item.groupLabel,
            items: [],
            sourceIndex: groupMap.size,
          });
        }
        groupMap.get(item.groupKey).items.push(item);
      });

      const groups = Array.from(groupMap.values());
      const configuredOrder = categoryConfig.groupOrder;

      if (!configuredOrder) return groups;
      return groups.sort((left, right) => {
        const leftIndex = configuredOrder.indexOf(left.key);
        const rightIndex = configuredOrder.indexOf(right.key);
        const leftRank = leftIndex === -1 ? configuredOrder.length : leftIndex;
        const rightRank = rightIndex === -1 ? configuredOrder.length : rightIndex;

        return leftRank - rightRank || left.sourceIndex - right.sourceIndex;
      });
    };

    const archiveGroupCountLabel = (count, categoryConfig) => {
      const noun = count === 1

        : categoryConfig.groupItemPlural;

      return `${String(count).padStart(2, "0")} ${noun}`;

    const createArchiveGroup = (category, group, categoryConfig) => {
      const stateKey = `${category}:${group.key}`;
      const container = createElement("details", "archive-group");
      const summary = createElement("summary", "archive-group-summary");
      const marker = createElement("span", "archive-group-marker");

    const renderArchiveCategory = (category) => {
      const categoryConfig = ARCHIVE_CATEGORIES[category];
      const items = archiveData?.[category];

      if (!categoryConfig || !items) {
        setArchiveLoading();
        return;
      }

      const expanded = expandedArchiveCategories.has(category);
      const visibleItems = categoryConfig.grouped || expanded
        ? items
        : items.slice(0, categoryConfig.previewLimit);
      const fragment = document.createDocumentFragment();

      archivePanelTitle.textContent = categoryConfig.title;
      archivePanel.setAttribute("aria-labelledby", `archive-tab-${category}`);
      archiveContent.removeAttribute("aria-busy");

      if (items.length === 0) {
        fragment.append(createElement("p", "archive-empty", "No records available."));
      } else if (categoryConfig.grouped) {
        const groups = createArchiveGroups(items, categoryConfig);

        if (!initializedArchiveGroupCategories.has(category)) {
          groups.forEach((group, groupIndex) => {
            if (categoryConfig.openAllGroups || groupIndex === 0) {
              openArchiveGroups.add(`${category}:${group.key}`);
            }
          });
          initializedArchiveGroupCategories.add(category);
        }

        const groupList = createElement("div", "archive-groups");
        groups.forEach((group) => {
          groupList.append(createArchiveGroup(category, group, categoryConfig));

        fragment.append(groupList);
      } else {
        const list = createElement("ol", "archive-list");
        visibleItems.forEach((item) => list.append(createArchiveItem(item)));
        fragment.append(list);

      if (!categoryConfig.grouped && items.length > categoryConfig.previewLimit) {
        const action = createElement(
          "button",

          expanded ? "SHOW LESS ↑" : `SHOW ALL ${String(items.length).padStart(2, "0")} ↓`,

        action.type = "button";
        action.addEventListener("click", () => {
          if (expandedArchiveCategories.has(category)) {

            expandedArchiveCategories.add(category);

          renderArchiveCategory(category);
          requestAnimationFrame(() => archiveContent.querySelector(".archive-action")?.focus({

    const selectArchiveCategory = (category, focusTab = false) => {
      if (!ARCHIVE_CATEGORIES[category]) return;
      activeArchiveCategory = category;
      const activeIndex = archiveTabs.findIndex(
        (tab) => tab.dataset.archiveCategory === category,
      );
      archiveIndex.style.setProperty("--archive-active-index", String(activeIndex));
      archiveIndex.style.setProperty("--archive-active-column", String(activeIndex % 3));
      archiveIndex.style.setProperty("--archive-active-row", String(Math.floor(activeIndex / 3)));

      archiveTabs.forEach((tab) => {

    const renderArchiveError = () => {

      message.setAttribute("role", "alert");
      const retry = createElement("button", "archive-action", "RETRY ↻");
      retry.type = "button";
      retry.addEventListener("click", () => {

        setArchiveLoading();
        void loadArchiveData();
      });
      archiveContent.replaceChildren(message, retry);

    const loadArchiveData = () => {
      if (archiveData) return Promise.resolve(archiveData);
      if (archiveLoadPromise) return archiveLoadPromise;

      archiveLoadPromise = Promise.all([
        requestJson("./my.json"),
        requestJson("./activities.json"),
        requestJson("./articles.json"),
        requestJson("./works.json"),
      ]).then((payloads) => {
        archiveData = normalizeArchiveData(payloads);
        renderArchiveCategory(activeArchiveCategory);
        return archiveData;
      }).catch((error) => {
        console.error("Unable to load profile data.", error);
        archiveLoadPromise = null;
        renderArchiveError();
        return null;

      return archiveLoadPromise;

    archiveTabs.forEach((tab, tabIndex) => {

      tab.addEventListener("keydown", (event) => {
        const keyOffsets = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 };
        let nextIndex = tabIndex;

        if (event.key in keyOffsets) {
          nextIndex = (tabIndex + keyOffsets[event.key] + archiveTabs.length)
            % archiveTabs.length;
        } else if (event.key === "Home") {
          nextIndex = 0;
        } else if (event.key === "End") {
          nextIndex = archiveTabs.length - 1;
        } else {

        event.preventDefault();
        selectArchiveCategory(archiveTabs[nextIndex].dataset.archiveCategory, true);

    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const mobileGameInput = window.matchMedia("(max-width: 40rem)");
    const FULL_TURN = Math.PI * 2;
    const DIRECTIONAL_RETURN_THRESHOLD = 1.2;
    const PROFILE_MORPH_PHASE_DURATION = 170;
    const GAME_SCORE_STORAGE_KEY = "aa-breakout.score-history.v1";
    const GAME_SCORE_HISTORY_LIMIT = 10;
    const GAME_COUNTDOWN_STEPS = Object.freeze(["3", "2", "1", "GO"]);

    const GAME_MEMORY_PICKUP_REPEAT_DELAY = Object.freeze([4, 7]);

      " KGKKKGKKKGKKKGK ",
      " KGKKKGKKKGKKKGK ",
      " KGGGGGGGGGGGGGK ",

    const gameScoreDateFormatter = new Intl.DateTimeFormat("en-CA", {

    const PORTRAIT_SPINNER_LABEL = spinner.getAttribute("aria-label");
    const PROFILE_SPINNER_LABEL = "Profile character icon. Memory (Kei Inoue).";
    let rotation = 0;
    let angularVelocity = 0;
    let targetRotation = 0;
    let animationFrame = 0;
    let activePointerId = null;
    let previousPointerAngle = 0;

    let identityMotion = null;

    const updateProfileStickyHeight = () => {
      const height = document.body.classList.contains("is-archive")
        ? Math.ceil(profileOverview.getBoundingClientRect().height)
        : 0;

      document.documentElement.style.setProperty("--profile-sticky-height", `${height}px`);
    };

    const animateIdentityPosition = (fromBounds) => {
      if (reducedMotion.matches) return;

      const toBounds = identity.getBoundingClientRect();
      const translateX = fromBounds.left - toBounds.left;
      const translateY = fromBounds.top - toBounds.top;

      if (Math.hypot(translateX, translateY) < 1) return;

      identityMotion?.cancel();
      identityMotion = identity.animate(
        [
          {
            opacity: 0.72,
            transform: `translate(${translateX}px, ${translateY}px)`,
          },
          { opacity: 1, transform: "translate(0, 0)" },
        ],
        {
          duration: 460,
          easing: "cubic-bezier(0.22, 0.72, 0.18, 1)",
          fill: "both",
        },
      );
      identityMotion.addEventListener("finish", () => {
        identityMotion?.cancel();
        identityMotion = null;
      }, { once: true });
    };

    if ("ResizeObserver" in window) {
      new ResizeObserver(updateProfileStickyHeight).observe(profileOverview);
    } else {
      window.addEventListener("resize", updateProfileStickyHeight);
    }

    const render = () => {
      spinner.style.setProperty("--rotation", `${rotation}rad`);
    };

    const stopMotion = () => {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      animationFrame = 0;
      angularVelocity = 0;
      targetRotation = rotation;
    };

    const normalizeAngle = (angle) => Math.atan2(Math.sin(angle), Math.cos(angle));

    const originalRotationTarget = () => {
      const turnPosition = rotation / FULL_TURN;
      const nearestTurn = Math.round(turnPosition);

      if (Math.abs(angularVelocity) < DIRECTIONAL_RETURN_THRESHOLD) {
        return nearestTurn * FULL_TURN;
      }

      if (Math.abs(turnPosition - nearestTurn) < 0.0001) {
        return (nearestTurn + Math.sign(angularVelocity)) * FULL_TURN;
      }

      return (angularVelocity > 0 ? Math.ceil(turnPosition) : Math.floor(turnPosition))
        * FULL_TURN;
    };

    const snapToOriginal = () => {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      animationFrame = 0;
      angularVelocity = 0;
      targetRotation = Math.round(rotation / FULL_TURN) * FULL_TURN;
      rotation = targetRotation;
      render();
    };

    const setProfileButtonState = (showProfile) => {
      profileLink.dataset.label = showProfile ? "Back" : "Profile";
      profileLink.setAttribute("aria-expanded", String(showProfile));
      profileLink.setAttribute(
        "aria-label",
        showProfile ? "Close profile" : "Open profile",
      );
    };

    const applyProfilePresentation = (showProfile) => {
      const identityStartBounds = identity.getBoundingClientRect();

      art.dataset.view = showProfile ? "profile" : "portrait";
      spinner.classList.toggle("is-profile", showProfile);
      document.documentElement.classList.toggle("is-archive", showProfile);
      document.body.classList.toggle("is-archive", showProfile);
      spinner.setAttribute(
        "aria-label",
        showProfile ? PROFILE_SPINNER_LABEL : PORTRAIT_SPINNER_LABEL,
      );
      updateProfileStickyHeight();
      animateIdentityPosition(identityStartBounds);
      requestAnimationFrame(updateProfileStickyHeight);
    };

    const finishProfileMorph = (showProfile) => {
      profileVisible = showProfile;
      profileTransitioning = false;
      art.classList.remove("is-morphing");
      art.removeAttribute("aria-busy");
      profileLink.removeAttribute("aria-disabled");

      if (showProfile) {
        archive.inert = false;
        archive.setAttribute("aria-hidden", "false");
        archive.classList.add("is-ready");
      } else {
        archive.inert = true;
        archive.setAttribute("aria-hidden", "true");
        archive.classList.remove("is-ready");
      }

      updateProfileStickyHeight();

      profileStatus.textContent = showProfile
        ? "Profile archive opened."
        : "Returned to character view.";

      if (pendingGameStart) {
        if (showProfile) {
          requestAnimationFrame(() => morphProfile(false));
        } else {
          pendingGameStart = false;
          requestAnimationFrame(() => beginGameCountdown());
        }
      }
    };

    const morphProfile = (showProfile) => {
      if (profileTransitioning || showProfile === profileVisible) return;

      snapToOriginal();
      profileTransitioning = true;

      if (showProfile) {
        void loadArchiveData();
      } else {
        archive.inert = true;
        archive.setAttribute("aria-hidden", "true");
        archive.classList.remove("is-ready");
        window.scrollTo({ top: 0, behavior: "auto" });

      art.setAttribute("aria-busy", "true");
      profileLink.setAttribute("aria-disabled", "true");
      setProfileButtonState(showProfile);

      if (reducedMotion.matches) {
        applyProfilePresentation(showProfile);
        finishProfileMorph(showProfile);
        return;
      }

      art.classList.add("is-morphing");

      window.setTimeout(() => {
        applyProfilePresentation(showProfile);
        void art.offsetWidth;

        requestAnimationFrame(() => {
          art.classList.remove("is-morphing");
          window.setTimeout(
            () => finishProfileMorph(showProfile),
            PROFILE_MORPH_PHASE_DURATION,
          );
        });
      }, PROFILE_MORPH_PHASE_DURATION);
    };

    const gameContext = breakoutLayer.getContext("2d");

    const formatGameScore = (value) => String(value).padStart(5, "0");

    const readGameScoreHistory = () => {
      try {
        const savedScores = JSON.parse(localStorage.getItem(GAME_SCORE_STORAGE_KEY) || "[]");
        if (!Array.isArray(savedScores)) return [];

        return savedScores
          .filter((entry) => (
            Number.isFinite(entry?.score)
            && entry.score >= 0
            && Number.isFinite(entry?.playedAt)
          ))
          .map((entry) => ({
            durationMs: Number.isFinite(entry.durationMs) && entry.durationMs >= 0
              ? entry.durationMs
              : null,
            playedAt: entry.playedAt,
            score: Math.floor(entry.score),
          }))
          .sort((left, right) => right.score - left.score || right.playedAt - left.playedAt)
          .slice(0, GAME_SCORE_HISTORY_LIMIT);
      } catch {
        return [];
      }
    };

    const saveGameScore = (score, durationMs) => {
      const scoreHistory = [
        ...readGameScoreHistory(),
        {
          durationMs: Math.max(0, Math.floor(durationMs)),
          playedAt: Date.now(),
          score: Math.max(0, Math.floor(score)),
        },
      ]
        .sort((left, right) => right.score - left.score || right.playedAt - left.playedAt)
        .slice(0, GAME_SCORE_HISTORY_LIMIT);

      try {
        localStorage.setItem(GAME_SCORE_STORAGE_KEY, JSON.stringify(scoreHistory));
      } catch {
        // ストレージが使えない場合も、今回の結果だけは表示する。
      }

      return scoreHistory;
    };

    const formatGameScoreDate = (playedAt) => {
      const parts = gameScoreDateFormatter.formatToParts(new Date(playedAt));
      const value = (type) => parts.find((part) => part.type === type)?.value || "--";

      return `${value("year")}.${value("month")}.${value("day")} ${value("hour")}:${value("minute")}`;
    };

    const renderGameScoreHistory = (scoreHistory) => {
      const fragment = document.createDocumentFragment();

      scoreHistory.forEach((entry, index) => {
        const item = document.createElement("li");
        const rank = document.createElement("span");
        const value = document.createElement("span");
        const duration = document.createElement("time");
        const date = document.createElement("time");

        item.className = "game-score-history-item";
        rank.className = "game-score-history-rank";
        value.className = "game-score-history-value";
        duration.className = "game-score-history-duration";
        date.className = "game-score-history-date";
        rank.textContent = String(index + 1).padStart(2, "0");
        value.textContent = formatGameScore(entry.score);
        if (entry.durationMs === null) {
          duration.textContent = "--:--";
        } else {
          duration.dateTime = `PT${Math.floor(entry.durationMs / 1000)}S`;
          duration.textContent = formatGameElapsedTime(entry.durationMs);
        }
        date.dateTime = new Date(entry.playedAt).toISOString();
        date.textContent = formatGameScoreDate(entry.playedAt);
        item.append(rank, value, duration, date);
        fragment.append(item);
      });

      gameScoreHistory.replaceChildren(fragment);
    };

    const updateGameScore = () => {
      const formattedScore = formatGameScore(gameScore);

      gameScoreElement.value = formattedScore;
      gameScoreElement.textContent = formattedScore;
    };

    const formatGameElapsedTime = (milliseconds) => {
      const totalSeconds = Math.min(99 * 60 + 59, Math.floor(milliseconds / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    };

    const updateGameElapsedTime = () => {
      const elapsedSecond = Math.min(
        99 * 60 + 59,
        Math.floor(gameElapsedMilliseconds / 1000),
      );
      if (displayedGameElapsedSecond === elapsedSecond) return;

      displayedGameElapsedSecond = elapsedSecond;
      const elapsedTime = formatGameElapsedTime(gameElapsedMilliseconds);
      gameElapsedTimeElement.value = elapsedTime;
      gameElapsedTimeElement.textContent = elapsedTime;
    };

    const captureGameElapsedTime = (time) => {
      if (gameClockPreviousTime <= 0) return;

      gameElapsedMilliseconds += Math.max(0, time - gameClockPreviousTime);
      gameClockPreviousTime = time;
      updateGameElapsedTime();

    const resizeGameLayer = () => {
      gamePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      breakoutLayer.height = Math.round(window.innerHeight * gamePixelRatio);

      if (gameContext) {

    const updateGameRenderMetrics = () => {
