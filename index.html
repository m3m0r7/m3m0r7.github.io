    const setGamePaddleCenter = (clientX) => {
      const paddleWidth = gamePaddleWidth || socialLinks.offsetWidth;
      const edgeSpace = 8;
      const halfWidth = paddleWidth / 2;
      const minimum = halfWidth + edgeSpace;
      const maximum = window.innerWidth - halfWidth - edgeSpace;

      gamePaddleCenter = minimum > maximum
        ? window.innerWidth / 2
        : Math.max(minimum, Math.min(maximum, clientX));
      socialLinks.style.setProperty(
        "--game-paddle-x",
        `${gamePaddleCenter - window.innerWidth / 2}px`,
      );
    };

    const restartDockHit = () => {
      socialLinks.classList.add("is-game-hit");
      window.clearTimeout(gameDockHitTimer);
      gameDockHitTimer = window.setTimeout(() => {
        socialLinks.classList.remove("is-game-hit");
        gameDockHitTimer = 0;
      }, 180);
    };

    const resetGameBoost = () => {
      gameBoostPower = 0;
      gameBoostExpiresAt = 0;
      document.body.classList.remove("is-game-boost-ready");
    };

    const updateGameChargeVisual = (charge) => {
      socialLinks.style.setProperty("--game-charge", String(charge));
      socialLinks.style.setProperty("--game-dock-depth", `${charge * 11.5}px`);
      socialLinks.style.setProperty("--game-dock-scale", String(1 - charge * 0.075));
      socialLinks.style.setProperty("--game-dock-groove", `${charge * 4.5}px`);
    };

    const resetGameCharge = () => {
      window.clearTimeout(gameDockReleaseTimer);
      gameDockReleaseTimer = 0;
      gameChargePointerId = null;
      gameChargeStartedAt = 0;
      gameCharge = 0;
      document.body.classList.remove("is-game-charging", "is-game-releasing");
      updateGameChargeVisual(0);
    };

    const beginGameCharge = (inputId) => {
      if (gameState !== "running" || gameChargePointerId !== null) return;

      window.clearTimeout(gameDockReleaseTimer);
      gameDockReleaseTimer = 0;
      document.body.classList.remove("is-game-releasing");
      resetGameBoost();
      gameChargePointerId = inputId;
      gameChargeStartedAt = performance.now();
      gameCharge = 0;
      document.body.classList.add("is-game-charging");
      updateGameChargeVisual(0);
    };

    const applyChargedDockBounce = (glyph, charge, impact = 0) => {
      const launchSpeed = 960 + charge * 860;

      glyph.vy = -Math.max(launchSpeed, Math.abs(glyph.vy) * 0.88 + 520);
      glyph.vx = Math.max(-520, Math.min(520, glyph.vx + impact * (210 + charge * 150)));
      glyph.spin += impact * (1.5 + charge * 1.8);
      glyph.penetrationHits = Math.max(
        glyph.penetrationHits,
        1 + Math.round(charge * 2),
      );
    };

    const gameObjectHalfExtents = (glyph, angle = glyph.angle) => {
      if (!glyph.width || !glyph.height) {
        return { x: glyph.radius, y: glyph.radius };
      }

      const cosine = Math.abs(Math.cos(angle));
      const sine = Math.abs(Math.sin(angle));
      return {
        x: cosine * glyph.width / 2 + sine * glyph.height / 2,
        y: sine * glyph.width / 2 + cosine * glyph.height / 2,
      };
    };

    const releaseGameCharge = (inputId) => {
      if (inputId !== gameChargePointerId) return;

      const heldFor = performance.now() - gameChargeStartedAt;
      const charge = Math.min(1, heldFor / 1050);
      gameChargePointerId = null;
      gameChargeStartedAt = 0;
      gameCharge = 0;
      document.body.classList.remove("is-game-charging");
      document.body.classList.add("is-game-releasing");
      void socialLinks.offsetWidth;
      updateGameChargeVisual(0);
      window.clearTimeout(gameDockReleaseTimer);
      gameDockReleaseTimer = window.setTimeout(() => {
        document.body.classList.remove("is-game-releasing");
        gameDockReleaseTimer = 0;
      }, 260);

      if (gameState !== "running" || heldFor < 240) return;

      const dockBounds = socialLinks.getBoundingClientRect();
      let launchedGlyphs = 0;

      gameBoostPower = charge;
      gameBoostExpiresAt = performance.now() + 1800;
      document.body.classList.add("is-game-boost-ready");
      gameGlyphs.forEach((glyph) => {
        const halfExtents = gameObjectHalfExtents(glyph);
        const withinDock = glyph.x + halfExtents.x >= dockBounds.left
          && glyph.x - halfExtents.x <= dockBounds.right;
        const closeToDock = glyph.y + halfExtents.y >= dockBounds.top - 110
          && glyph.y - halfExtents.y <= dockBounds.bottom + 24;
        if (!glyph.alive || !glyph.released || !withinDock || !closeToDock || glyph.vy < -250) {
          return;
        }

        const impact = Math.max(
          -1,
          Math.min(1, (glyph.x - (dockBounds.left + dockBounds.width / 2))
            / (dockBounds.width / 2)),
        );
        glyph.y = Math.min(glyph.y, dockBounds.top - halfExtents.y);
        applyChargedDockBounce(glyph, charge, impact);
        launchedGlyphs += 1;
      });
      restartDockHit();
      profileStatus.textContent = launchedGlyphs > 0
        ? `Dock released at ${Math.round(charge * 100)} percent and launched ${launchedGlyphs} glyphs.`
        : `Dock charged at ${Math.round(charge * 100)} percent for the next bounce.`;
    };

    const pseudoText = (element, pseudoElement) => {
      const content = getComputedStyle(element, pseudoElement).content;

      if (!content || content === "none" || content === "normal") return "";
      return content.replace(/^(["'])(.*)\1$/, "$2");
    };

    const createGameGlyphGroup = (element, text, orderOffset, tone) => {
      if (!gameContext || !text) return [];

      const bounds = element.getBoundingClientRect();
      const style = getComputedStyle(element);
      const fontSize = Number.parseFloat(style.fontSize) || 16;
      const letterSpacing = Number.parseFloat(style.letterSpacing) || 0;
      const font = `${style.fontWeight} ${fontSize}px ${style.fontFamily}`;
      const characters = Array.from(text);

      gameContext.font = font;
      const widths = characters.map((character) => gameContext.measureText(character).width);
      const totalWidth = widths.reduce((sum, width) => sum + width, 0)
        + Math.max(0, characters.length - 1) * letterSpacing;
      let cursor = bounds.left + bounds.width / 2 - totalWidth / 2;

      const glyphs = [];

      characters.forEach((character, index) => {
        const width = widths[index];
        const progress = characters.length < 2 ? 1 : index / (characters.length - 1);
        const color = tone === "name"
          ? progress < 0.45 ? "#241e26" : progress < 0.78 ? "#a6304e" : "#d45570"
          : tone === "cta"
            ? progress < 0.7 ? "#a6304e" : "#d45570"
            : tone === "hint"
              ? progress < 0.84 ? "#6d686e" : "#a6304e"
          : progress < 0.42 ? "#6d686e" : progress < 0.82 ? "#a6304e" : "#c23c58";

        if (character.trim()) {
          glyphs.push({
            alive: true,
            angle: 0,
            character,
            color,
            font,
            hitCooldown: 0,
            penetrationHits: 0,
            radius: Math.max(6, Math.min(13, fontSize * 0.38)),
            releaseDelay: (orderOffset + index) * 42,
            released: false,
            spin: ((index % 5) - 2) * 0.55,
            vx: ((index % 7) - 3) * 15 + (tone === "email" ? 10 : -8),
            vy: 18 + (index % 4) * 7,
            x: cursor + width / 2,
            y: bounds.top + bounds.height / 2,
          });
        }

        cursor += width + letterSpacing;
      });

      return glyphs;
    };

    const createGameButtonBackground = (element, orderOffset) => {
      const bounds = element.getBoundingClientRect();
      const style = getComputedStyle(element);

      return {
        alive: true,
        angle: 0,
        character: "CTA",
        fill: style.backgroundColor,
        height: bounds.height,
        hitCooldown: 0,
        kind: "button-background",
        penetrationHits: 0,
        radius: Math.min(bounds.width, bounds.height) / 2,
        releaseDelay: orderOffset * 42,
        released: false,
        shadowColor: "rgb(36 30 38 / 16%)",
        shadowOffsetX: 2.88,
        shadowOffsetY: 2.88,
        spin: -0.16,
        stroke: style.borderTopColor,
        vx: -24,
        vy: 20,
        width: bounds.width,
        x: bounds.left + bounds.width / 2,
        y: bounds.top + bounds.height / 2,
      };
    };

    const createGameGlyphs = () => {
      const nameText = profileName.textContent.trim();
      const emailText = `${profileEmail.textContent}${pseudoText(profileEmail, "::after")}`;
      const rotateHintGlyphs = createGameGlyphGroup(
        rotateHint,
        rotateHint.dataset.gameText,
        0,
        "hint",
      );
      const nameGlyphs = createGameGlyphGroup(profileName, nameText, 0, "name");
      const emailGlyphs = createGameGlyphGroup(
        profileEmail,
        emailText,
        nameGlyphs.length + 2,
        "email",
      );
      const portfolioOrderOffset = nameGlyphs.length + emailGlyphs.length + 4;
      const portfolioBackground = createGameButtonBackground(
        profilePortfolio,
        portfolioOrderOffset,
      );
      const portfolioGlyphs = createGameGlyphGroup(
        profilePortfolio,
        profilePortfolio.dataset.gameText,
        portfolioOrderOffset,
        "cta",
      );
      const hintGlyphs = createGameGlyphGroup(
        gameStartHint,
        gameStartHint.textContent.trim(),
        portfolioOrderOffset + portfolioGlyphs.length + 4,
        "hint",
      );

      return [
        ...rotateHintGlyphs,
        ...nameGlyphs,
        ...emailGlyphs,
        portfolioBackground,
        ...portfolioGlyphs,
        ...hintGlyphs,
      ];
    };

    const randomGameMemoryPickupDelay = ([minimum, maximum]) => (
      minimum + Math.random() * (maximum - minimum)
    );

    const updateGameMemoryState = () => {
      const active = gameMemoryBoostRemaining > 0;

      document.body.classList.toggle("is-game-memory-active", active);
      if (active) {
        socialLinks.dataset.memoryBoost = "active";
      } else {
        socialLinks.removeAttribute("data-memory-boost");
      }
    };

    const resetGameMemoryPower = () => {
      gameMemoryPickups = [];
      gameMemoryPickupCooldown = 0;
      gameMemoryBoostRemaining = 0;
      gameMemoryWindowId = 0;
      updateGameMemoryState();
    };

    const spawnGameMemoryPickup = () => {
      const pixelSize = window.innerWidth <= 640 ? 3.2 : 4;
      const width = GAME_MEMORY_PICKUP_ART[0].length * pixelSize;
      const height = GAME_MEMORY_PICKUP_ART.length * pixelSize;
      const margin = Math.max(20, width / 2 + 8);

      gameMemoryPickups = [{
        height,
        pixelSize,
        vx: (Math.random() - 0.5) * 28,
        vy: 420 + Math.random() * 40,
        width,
        x: margin + Math.random() * Math.max(0, window.innerWidth - margin * 2),
        y: -height / 2 - 4,
      }];
      profileStatus.textContent = "A memory module appeared. Catch it with the Dock.";
    };

    const drawGameMemoryPickup = (pickup) => {
      if (!gameContext) return;

      const offsetX = -pickup.width / 2;
      const offsetY = -pickup.height / 2;
      const drawPixels = (palette, shift = 0) => {
        GAME_MEMORY_PICKUP_PIXELS.forEach(({ columnIndex, rowIndex, tone }) => {
          gameContext.fillStyle = palette ? palette[tone] : "rgb(36 30 38 / 18%)";
          gameContext.fillRect(
            Math.round(offsetX + columnIndex * pickup.pixelSize + shift),
            Math.round(offsetY + rowIndex * pickup.pixelSize + shift),
            Math.ceil(pickup.pixelSize),
            Math.ceil(pickup.pixelSize),
          );
        });
      };

      gameContext.save();
      gameContext.translate(Math.round(pickup.x), Math.round(pickup.y));
      gameContext.imageSmoothingEnabled = false;
      drawPixels(null, pickup.pixelSize * 0.8);
      drawPixels(GAME_MEMORY_PICKUP_PALETTE);
      gameContext.restore();
    };

    const addGameMemoryBurst = (x, y, announceBoost = false) => {
      if (reducedMotion.matches) return;

      const particles = announceBoost
        ? [
          { character: "2", color: "#c23c58", vx: -62 },
          { character: "X", color: "#c23c58", vx: 0 },
          { character: "✦", color: "#f3be68", vx: 62 },
        ]
        : [
          { character: "✦", color: "#f3be68", vx: -24 },
          { character: "✦", color: "#d45570", vx: 24 },
        ];

      particles.forEach(({ character, color, vx }, index) => {
        gameParticles.push({
          character,
          color,
          fontSize: announceBoost && character !== "✦" ? 16 : 11,
          life: 0.9,
          maxLife: 0.9,
          vx,
          vy: -150 - index * 18,
          x: x + (index - (particles.length - 1) / 2) * 9,
          y,
        });
      });
    };

    const collectGameMemoryPickup = (pickup, dockBounds) => {
      gameMemoryBoostRemaining = GAME_MEMORY_BOOST_DURATION;
      gameMemoryWindowId += 1;
      gameMemoryPickupCooldown = randomGameMemoryPickupDelay(
        GAME_MEMORY_PICKUP_REPEAT_DELAY,
      );
      updateGameMemoryState();
      addGameMemoryBurst(pickup.x, dockBounds.top - 4, true);
      restartDockHit();
      profileStatus.textContent = `Memory boost active for ${GAME_MEMORY_BOOST_DURATION} seconds.`;
    };

    const updateAndDrawGameMemoryPickups = (elapsed, dockBounds) => {
      if (!gameContext) return;

      if (gameMemoryPickups.length === 0) {
        gameMemoryPickupCooldown -= elapsed;
        if (gameMemoryPickupCooldown <= 0) spawnGameMemoryPickup();
      }

      gameMemoryPickups = gameMemoryPickups.filter((pickup) => {
        const previousY = pickup.y;
        const halfWidth = pickup.width / 2;
        const halfHeight = pickup.height / 2;

        pickup.vy += 18 * elapsed;
        pickup.x += pickup.vx * elapsed;
        pickup.y += pickup.vy * elapsed;

        if (pickup.x - halfWidth <= 6 && pickup.vx < 0) {
          pickup.x = halfWidth + 6;
          pickup.vx = Math.abs(pickup.vx);
        } else if (pickup.x + halfWidth >= window.innerWidth - 6 && pickup.vx > 0) {
          pickup.x = window.innerWidth - halfWidth - 6;
          pickup.vx = -Math.abs(pickup.vx);
        }

        const intersectsDock = pickup.x + halfWidth >= dockBounds.left
          && pickup.x - halfWidth <= dockBounds.right
          && previousY + halfHeight <= dockBounds.top + 8
          && pickup.y + halfHeight >= dockBounds.top;

        if (intersectsDock) {
          collectGameMemoryPickup(pickup, dockBounds);
          return false;
        }

        if (pickup.y - halfHeight > window.innerHeight + 12) {
          gameMemoryPickupCooldown = randomGameMemoryPickupDelay(
            GAME_MEMORY_PICKUP_REPEAT_DELAY,
          );
          return false;
        }

        drawGameMemoryPickup(pickup);
        return true;
      });
    };

    const drawGameMemoryBoost = (dockBounds) => {
      if (!gameContext || gameMemoryBoostRemaining <= 0) return;

      const label = `2X ${gameMemoryBoostRemaining.toFixed(1)}S`;

      gameContext.save();
      gameContext.fillStyle = "#76243d";
      gameContext.font = `800 11px ${gameHeadingFont}`;
      gameContext.letterSpacing = "1px";
      gameContext.textAlign = "center";
      gameContext.textBaseline = "bottom";
      gameContext.shadowColor = "rgb(255 255 255 / 96%)";
      gameContext.shadowBlur = 7;
      gameContext.fillText(label, dockBounds.left + dockBounds.width / 2, dockBounds.top - 8);
      gameContext.restore();
    };

    const splitGameGlyph = (glyph) => {
      if (
        gameMemoryBoostRemaining <= 0
        || glyph.memoryWindowId === gameMemoryWindowId
        || gameGlyphs.length >= 96
      ) return false;

      const spread = Math.max(170, Math.min(250, Math.abs(glyph.vx) * 0.45 + 165));
      const originalHalfExtents = gameObjectHalfExtents(glyph);
      const separation = Math.min(originalHalfExtents.x * 0.7, 28);
      const clone = {
        ...glyph,
        angle: glyph.angle + 0.12,
        hitCooldown: Math.max(glyph.hitCooldown, 0.08),
        memoryWindowId: gameMemoryWindowId,
        released: true,
        spin: -glyph.spin || 0.8,
        vx: Math.max(-540, Math.min(540, glyph.vx + spread)),
        x: glyph.x + separation,
      };
      const cloneHalfExtents = gameObjectHalfExtents(clone);
      clone.x = Math.min(window.innerWidth - cloneHalfExtents.x, clone.x);

      glyph.hitCooldown = Math.max(glyph.hitCooldown, 0.08);
      glyph.memoryWindowId = gameMemoryWindowId;
      glyph.spin = glyph.spin || -0.8;
      glyph.vx = Math.max(-540, Math.min(540, glyph.vx - spread));
      glyph.x = Math.max(originalHalfExtents.x, glyph.x - separation);
      gameGlyphs.push(clone);
      addGameMemoryBurst((glyph.x + clone.x) / 2, glyph.y);
      profileStatus.textContent = `${glyph.character} split into two. Memory boost ${gameMemoryBoostRemaining.toFixed(1)} seconds left.`;
      return true;
    };

    const isDestructiblePortraitCell = (index) => {
      const cell = portraitCells[index];
      return Boolean(
        cell
        && (cell.background || (cell.foreground && cell.character !== " "))
      );
    };

    const destructiblePortraitCellCount = portraitCells.reduce(
      (count, _, index) => count + (isDestructiblePortraitCell(index) ? 1 : 0),
      0,
    );

    const isPortraitCleared = () => (
      destroyedPortraitCells.size >= destructiblePortraitCellCount
    );

    const addGameParticle = (cellIndex, artBounds) => {
      if (reducedMotion.matches || gameParticles.length > 130) return;

      const cell = portraitCells[cellIndex];
      const column = cellIndex % GRID_WIDTH;
      const row = Math.floor(cellIndex / GRID_WIDTH);
      const x = artBounds.left + ((column + 0.5) / GRID_WIDTH) * artBounds.width;
      const y = artBounds.top + ((row + 0.5) / GRID_HEIGHT) * artBounds.height;

      gameParticles.push({
        character: cell.character === " " ? "▪" : cell.character,
        color: cell.foreground || cell.background || "#a6304e",
        fontSize: Math.max(7, artBounds.height / GRID_HEIGHT * 0.82),
        life: 0.72,
        maxLife: 0.72,
        vx: (Math.random() - 0.5) * 190,
        vy: -80 - Math.random() * 130,
        x,
        y,
      });
    };

    const getPortraitCollisionCells = (glyph, artBounds, pose = glyph) => {
      if (!glyph.width || !glyph.height) {
        const centerColumn = Math.floor(
          ((pose.x - artBounds.left) / artBounds.width) * GRID_WIDTH,
        );
        const centerRow = Math.floor(
          ((pose.y - artBounds.top) / artBounds.height) * GRID_HEIGHT,
        );
        const cellIndices = [];

        for (let rowOffset = -1; rowOffset <= 1; rowOffset += 1) {
          for (let columnOffset = -2; columnOffset <= 2; columnOffset += 1) {
            if ((columnOffset * columnOffset) / 4 + rowOffset * rowOffset > 1.35) continue;

            const column = centerColumn + columnOffset;
            const row = centerRow + rowOffset;
            if (column < 0 || column >= GRID_WIDTH || row < 0 || row >= GRID_HEIGHT) continue;
            cellIndices.push(row * GRID_WIDTH + column);
          }
        }

        return cellIndices;
      }

      const cellWidth = artBounds.width / GRID_WIDTH;
      const cellHeight = artBounds.height / GRID_HEIGHT;
      const halfExtents = gameObjectHalfExtents(glyph, pose.angle);
      const minimumColumn = Math.max(
        0,
        Math.floor((pose.x - halfExtents.x - artBounds.left) / cellWidth) - 1,
      );
      const maximumColumn = Math.min(
        GRID_WIDTH - 1,
        Math.floor((pose.x + halfExtents.x - artBounds.left) / cellWidth) + 1,
      );
      const minimumRow = Math.max(
        0,
        Math.floor((pose.y - halfExtents.y - artBounds.top) / cellHeight) - 1,
      );
      const maximumRow = Math.min(
        GRID_HEIGHT - 1,
        Math.floor((pose.y + halfExtents.y - artBounds.top) / cellHeight) + 1,
      );
      const cosine = Math.cos(pose.angle);
      const sine = Math.sin(pose.angle);
      const absoluteCosine = Math.abs(cosine);
      const absoluteSine = Math.abs(sine);
      const cellProjectionX = absoluteCosine * cellWidth / 2
        + absoluteSine * cellHeight / 2;
      const cellProjectionY = absoluteSine * cellWidth / 2
        + absoluteCosine * cellHeight / 2;
      const cellIndices = [];

      for (let row = minimumRow; row <= maximumRow; row += 1) {
        for (let column = minimumColumn; column <= maximumColumn; column += 1) {
          const cellX = artBounds.left + (column + 0.5) * cellWidth;
          const cellY = artBounds.top + (row + 0.5) * cellHeight;
          const offsetX = cellX - pose.x;
          const offsetY = cellY - pose.y;
          if (
            Math.abs(offsetX) > halfExtents.x + cellWidth / 2
            || Math.abs(offsetY) > halfExtents.y + cellHeight / 2
          ) continue;

          const localX = offsetX * cosine + offsetY * sine;
          const localY = -offsetX * sine + offsetY * cosine;
          if (
            Math.abs(localX) <= glyph.width / 2 + cellProjectionX
            && Math.abs(localY) <= glyph.height / 2 + cellProjectionY
          ) {
            cellIndices.push(row * GRID_WIDTH + column);
          }
        }
      }

      return cellIndices;
    };

    const getSweptPortraitCollisionCells = (glyph, artBounds, previousPose) => {
      if (!glyph.width || !glyph.height || !previousPose) {
        return getPortraitCollisionCells(glyph, artBounds);
      }

      const cellWidth = artBounds.width / GRID_WIDTH;
      const cellHeight = artBounds.height / GRID_HEIGHT;
      const translation = Math.hypot(glyph.x - previousPose.x, glyph.y - previousPose.y);
      const rotationTravel = Math.abs(glyph.angle - previousPose.angle)
        * Math.hypot(glyph.width, glyph.height) / 2;
      const sampleDistance = Math.max(2, Math.min(cellWidth, cellHeight) * 0.45);
      const sampleCount = Math.min(
        24,
        Math.max(1, Math.ceil((translation + rotationTravel) / sampleDistance)),
      );
      const cellIndices = new Set();

      for (let sample = 0; sample <= sampleCount; sample += 1) {
        const progress = sample / sampleCount;
        const pose = {
          angle: previousPose.angle + (glyph.angle - previousPose.angle) * progress,
          x: previousPose.x + (glyph.x - previousPose.x) * progress,
          y: previousPose.y + (glyph.y - previousPose.y) * progress,
        };
        getPortraitCollisionCells(glyph, artBounds, pose).forEach((cellIndex) => {
          cellIndices.add(cellIndex);
        });
      }

      return Array.from(cellIndices);
    };

    const destroyPortraitCluster = (glyph, artBounds, previousPose = null) => {
      if (glyph.hitCooldown > 0) return 0;
      const removedCells = [];

      getSweptPortraitCollisionCells(glyph, artBounds, previousPose).forEach((cellIndex) => {
        if (
          destroyedPortraitCells.has(cellIndex)
          || !isDestructiblePortraitCell(cellIndex)
        ) return;

        destroyedPortraitCells.add(cellIndex);
        removedCells.push(cellIndex);
      });

      if (removedCells.length === 0) return 0;

      removedCells.forEach((cellIndex) => addGameParticle(cellIndex, artBounds));
      gameScore += removedCells.length;
      updateGameScore();
      if (glyph.penetrationHits > 0) {
        glyph.penetrationHits -= 1;
        glyph.hitCooldown = 0.018;
        glyph.vy *= 0.94;
      } else {
        glyph.hitCooldown = 0.1;
        glyph.vy = glyph.vy < 0
          ? Math.max(170, Math.abs(glyph.vy) * 0.66)
          : -Math.max(170, Math.abs(glyph.vy) * 0.66);
      }
      glyph.vx += (Math.random() - 0.5) * 80;
      return removedCells.length;
    };

    const drawGameGlyph = (glyph) => {
      if (!gameContext) return;

      gameContext.save();
      gameContext.translate(glyph.x, glyph.y);
      gameContext.rotate(glyph.angle);

      if (glyph.kind === "button-background") {
        gameContext.fillStyle = glyph.fill;
        gameContext.strokeStyle = glyph.stroke;
        gameContext.lineWidth = 1;
        gameContext.shadowColor = glyph.shadowColor;
        gameContext.shadowBlur = 0;
        gameContext.shadowOffsetX = glyph.shadowOffsetX;
        gameContext.shadowOffsetY = glyph.shadowOffsetY;
        gameContext.beginPath();
        gameContext.rect(-glyph.width / 2, -glyph.height / 2, glyph.width, glyph.height);
        gameContext.fill();
        gameContext.shadowColor = "transparent";
        gameContext.shadowOffsetX = 0;
        gameContext.shadowOffsetY = 0;
        gameContext.stroke();
        gameContext.restore();
        return;
      }

      gameContext.font = glyph.font;
      gameContext.textAlign = "center";
      gameContext.textBaseline = "middle";
      gameContext.fillStyle = glyph.color;
      gameContext.shadowColor = "rgb(166 48 78 / 24%)";
      gameContext.shadowBlur = 8;
      gameContext.fillText(glyph.character, 0, 0);
      gameContext.restore();
    };

    const updateAndDrawGameParticles = (elapsed) => {
      if (!gameContext) return;

      gameParticles = gameParticles.filter((particle) => {
        particle.life -= elapsed;
        if (particle.life <= 0) return false;

        particle.vy += 620 * elapsed;
        particle.x += particle.vx * elapsed;
        particle.y += particle.vy * elapsed;
        gameContext.globalAlpha = Math.max(0, particle.life / particle.maxLife);
        gameContext.fillStyle = particle.color;
        gameContext.font = `700 ${particle.fontSize}px ${gameTerminalFont}`;
        gameContext.textAlign = "center";
        gameContext.textBaseline = "middle";
        gameContext.fillText(particle.character, particle.x, particle.y);
        return true;
      });
      gameContext.globalAlpha = 1;
    };

    const gameLoop = (time) => {
      if (gameState !== "running" || !gameContext) return;

      const elapsed = Math.min((time - gamePreviousTime) / 1000, 0.028);
      const artBounds = gameArtBounds || art.getBoundingClientRect();
      const dockBounds = socialLinks.getBoundingClientRect();
      let artChanged = false;

      gamePreviousTime = time;
      captureGameElapsedTime(time);
      gameContext.setTransform(gamePixelRatio, 0, 0, gamePixelRatio, 0, 0);
      gameContext.clearRect(0, 0, window.innerWidth, window.innerHeight);

      if (gameChargePointerId !== null) {
        gameCharge = Math.min(1, (time - gameChargeStartedAt) / 1050);
        updateGameChargeVisual(gameCharge);
      }

      if (gameBoostExpiresAt > 0 && time >= gameBoostExpiresAt) resetGameBoost();

      if (gameMemoryBoostRemaining > 0) {
        gameMemoryBoostRemaining = Math.max(0, gameMemoryBoostRemaining - elapsed);
        if (gameMemoryBoostRemaining === 0) {
          updateGameMemoryState();
          profileStatus.textContent = "Memory boost ended.";
        }
      }

      const keyboardDirection = (gameMoveKeys.has("ArrowRight") ? 1 : 0)
        - (gameMoveKeys.has("ArrowLeft") ? 1 : 0);
      if (keyboardDirection !== 0) {
        setGamePaddleCenter(gamePaddleCenter + keyboardDirection * 560 * elapsed);
      }

      updateAndDrawGameMemoryPickups(elapsed, dockBounds);

      gameGlyphs.forEach((glyph) => {
        if (!glyph.alive) return;

        if (!glyph.released && time - gameStartTime >= glyph.releaseDelay) {
          glyph.released = true;
        }

        if (!glyph.released) {
          drawGameGlyph(glyph);
          return;
        }

        const previousPose = {
          angle: glyph.angle,
          x: glyph.x,
          y: glyph.y,
        };
        glyph.hitCooldown = Math.max(0, glyph.hitCooldown - elapsed);
        glyph.vy += 590 * elapsed;
        glyph.vx *= Math.pow(0.998, elapsed * 60);
        glyph.x += glyph.vx * elapsed;
        glyph.y += glyph.vy * elapsed;
        glyph.angle += glyph.spin * elapsed;
        let halfExtents = gameObjectHalfExtents(glyph);

        if (glyph.x - halfExtents.x <= 0 && glyph.vx < 0) {
          glyph.x = halfExtents.x;
          glyph.vx = Math.abs(glyph.vx) * 0.9;
        } else if (glyph.x + halfExtents.x >= window.innerWidth && glyph.vx > 0) {
          glyph.x = window.innerWidth - halfExtents.x;
          glyph.vx = -Math.abs(glyph.vx) * 0.9;
        }

        if (glyph.y - halfExtents.y <= 0 && glyph.vy < 0) {
          glyph.y = halfExtents.y;
          glyph.vy = Math.abs(glyph.vy) * 0.82;
          glyph.penetrationHits = 0;
        }

        if (
          glyph.vy > 0
          && glyph.x + halfExtents.x >= dockBounds.left
          && glyph.x - halfExtents.x <= dockBounds.right
          && previousPose.y + halfExtents.y <= dockBounds.top + 7
          && glyph.y + halfExtents.y >= dockBounds.top
        ) {
          const impact = Math.max(
            -1,
            Math.min(1, (glyph.x - (dockBounds.left + dockBounds.width / 2))
              / (dockBounds.width / 2)),
          );
          glyph.y = dockBounds.top - halfExtents.y;
          if (gameBoostPower > 0 && time < gameBoostExpiresAt) {
            applyChargedDockBounce(glyph, gameBoostPower, impact);
          } else {
            glyph.vy = -Math.max(720, Math.min(940, Math.abs(glyph.vy) * 0.82 + 470));
            glyph.vx = Math.max(-460, Math.min(460, glyph.vx + impact * 260));
            glyph.spin += impact * 1.4;
            glyph.penetrationHits = 0;
          }
          restartDockHit();
          splitGameGlyph(glyph);
          halfExtents = gameObjectHalfExtents(glyph);
        }

        if (destroyPortraitCluster(glyph, artBounds, previousPose) > 0) artChanged = true;

        if (glyph.y - halfExtents.y > window.innerHeight + 28) {
          glyph.alive = false;
          return;
        }

        drawGameGlyph(glyph);
      });

      if (artChanged) {
        renderCharacter(art, destroyedPortraitCells, gameTerminalFont);
        if (isPortraitCleared()) {
          finishGame("clear");
          return;
        }
      }
      updateAndDrawGameParticles(elapsed);
      drawGameMemoryBoost(dockBounds);

      if (!gameGlyphs.some((glyph) => glyph.alive)) {
        finishGame();
        return;
      }

      gameFrame = requestAnimationFrame(gameLoop);
    };

    const startGameRound = (token) => {
      if (gameState !== "countdown" || token !== gameRunToken) return;

      updateGameRenderMetrics();
      gameGlyphs = createGameGlyphs();
      if (gameGlyphs.length === 0) {
        finishGame();
        return;
      }

      gameState = "running";
      gameMemoryPickupCooldown = randomGameMemoryPickupDelay(
        GAME_MEMORY_PICKUP_INITIAL_DELAY,
      );
      gameCountdown.setAttribute("aria-hidden", "true");
      document.body.classList.add("is-game-running");
      gameStartTime = performance.now();
      gamePreviousTime = gameStartTime;
      gameClockPreviousTime = gameStartTime;
      gameElapsedMilliseconds = 0;
      updateGameElapsedTime();
      profileStatus.textContent = "AA breakout started. Move the Dock with the pointer or arrow keys.";
      gameFrame = requestAnimationFrame(gameLoop);
    };

    const runGameCountdown = (token, initialStepIndex = 0) => {
      let stepIndex = initialStepIndex;

      const showStep = () => {
        if (gameState !== "countdown" || token !== gameRunToken) return;

        if (stepIndex >= GAME_COUNTDOWN_STEPS.length) {
          startGameRound(token);
          return;
        }

        const step = GAME_COUNTDOWN_STEPS[stepIndex];
        const isGo = step === "GO";

        gameCountdownNumber.textContent = step;
        gameCountdownNumber.dataset.value = step;
        gameCountdown.dataset.step = isGo ? "go" : String(stepIndex);
        gameCountdown.style.setProperty(
          "--countdown-progress",
          String((stepIndex + 1) / GAME_COUNTDOWN_STEPS.length),
        );
        gameCountdownNumber.classList.remove("is-ticking");
        void gameCountdownNumber.offsetWidth;
        gameCountdownNumber.classList.add("is-ticking");
        profileStatus.textContent = isGo
          ? "Go."
          : `${Number(step)}.`;
        stepIndex += 1;
        gameCountdownTimer = window.setTimeout(showStep, isGo ? 460 : 620);
      };

      showStep();
    };

    const beginGameCountdown = () => {
      if (gameState !== "idle") return;

      gameState = "countdown";
      gameRunToken += 1;
      gameReturnFocus = document.activeElement instanceof HTMLElement
        ? document.activeElement
        : null;
      gameScore = 0;
      gameClockPreviousTime = 0;
      gameElapsedMilliseconds = 0;
      gameGlyphs = [];
      gameParticles = [];
      resetGameMemoryPower();
      destroyedPortraitCells.clear();
      updateGameScore();
      updateGameElapsedTime();
      snapToOriginal();
      rotation = 0;
      render();
      renderCharacter(art);
      resizeGameLayer();
      document.body.classList.add("is-game-mode");
      updateGameRenderMetrics();
      setGamePaddleCenter(window.innerWidth / 2);
      breakoutLayer.hidden = false;
      gameCountdown.dataset.step = "0";
      gameCountdown.style.setProperty("--countdown-progress", "0");
      gameCountdown.setAttribute("aria-hidden", "false");
      spinner.disabled = true;
      profilePortfolio.inert = true;
      profilePortfolio.setAttribute("aria-disabled", "true");
      runGameCountdown(gameRunToken);
    };

    const requestGameStart = () => {
      if (gameState !== "idle") return;

      if (profileTransitioning) {
        pendingGameStart = true;
        return;
      }

      if (profileVisible) {
        pendingGameStart = true;
        morphProfile(false);
        return;
      }

      beginGameCountdown();
    };

    const updateGameStartHintMode = () => {
      const touchStartEnabled = mobileGameInput.matches;

      gameStartHint.textContent = touchStartEnabled
        ? "TOUCH HERE TO START THE GAME"
        : "PRESS SPACE TO START THE GAME";
      gameStartHint.disabled = !touchStartEnabled;
    };

    updateGameStartHintMode();
    mobileGameInput.addEventListener("change", updateGameStartHintMode);
    gameStartHint.addEventListener("click", () => {
      if (mobileGameInput.matches) requestGameStart();
    });

    const pauseGame = () => {
      if (gameState !== "countdown" && gameState !== "running") return;

      gamePausedFrom = gameState;
      if (gameState === "running") captureGameElapsedTime(performance.now());
      gameClockPreviousTime = 0;
      window.clearTimeout(gameCountdownTimer);
      gameCountdownTimer = 0;
      if (gameFrame) cancelAnimationFrame(gameFrame);
      gameFrame = 0;
      resetGameCharge();
      resetGameBoost();
      gameMoveKeys.clear();
      gameState = "paused";
      document.body.classList.add("is-game-paused");
      gameCountdown.setAttribute("aria-hidden", "true");
      profileStatus.textContent = "Game paused.";

      if (!gamePauseDialog.open) gamePauseDialog.showModal();
      gameResume.focus({ preventScroll: true });
    };

    const resumeGame = () => {
      if (gameState !== "paused") return;

      const resumeFrom = gamePausedFrom;
      gamePausedFrom = null;
      if (gamePauseDialog.open) gamePauseDialog.close();
      document.body.classList.remove("is-game-paused");

      if (resumeFrom === "countdown") {
        const pausedStepIndex = Math.max(
          0,
          GAME_COUNTDOWN_STEPS.indexOf(gameCountdownNumber.textContent),
        );
        gameState = "countdown";
        gameCountdown.setAttribute("aria-hidden", "false");
        runGameCountdown(gameRunToken, pausedStepIndex);
        profileStatus.textContent = "Countdown resumed.";
        return;
      }

      gameState = "running";
      gamePreviousTime = performance.now();
      gameClockPreviousTime = gamePreviousTime;
      profileStatus.textContent = "Game resumed.";
      gameFrame = requestAnimationFrame(gameLoop);
    };

    const restoreGamePresentation = () => {
      window.clearTimeout(gameCountdownTimer);
      gameCountdownTimer = 0;
      if (gameFrame) cancelAnimationFrame(gameFrame);
      gameFrame = 0;
      gameRunToken += 1;
      document.body.classList.remove(
        "is-game-mode",
        "is-game-running",
        "is-game-paused",
        "is-game-charging",
        "is-game-releasing",
        "is-game-boost-ready",
      );
      gameCountdown.setAttribute("aria-hidden", "true");
      breakoutLayer.hidden = true;
      gameClockPreviousTime = 0;
      spinner.disabled = false;
      profilePortfolio.inert = false;
      profilePortfolio.removeAttribute("aria-disabled");
      if (gamePauseDialog.open) gamePauseDialog.close();
      gamePausedFrom = null;
      resetGameCharge();
      resetGameBoost();
      gameMoveKeys.clear();
      window.clearTimeout(gameDockHitTimer);
      gameDockHitTimer = 0;
      socialLinks.classList.remove("is-game-hit");
      socialLinks.style.setProperty("--game-paddle-x", "0px");
      destroyedPortraitCells.clear();
      gameGlyphs = [];
      gameParticles = [];
      gameArtBounds = null;
      gamePaddleWidth = 0;
      gameTerminalFont = "";
      gameHeadingFont = "";
      resetGameMemoryPower();
      renderCharacter(art);

      if (gameContext) {
        gameContext.setTransform(gamePixelRatio, 0, 0, gamePixelRatio, 0, 0);
        gameContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
    };

    const finishGame = (outcome = "gameover") => {
      if (
        gameState !== "countdown"
        && gameState !== "running"
        && gameState !== "paused"
      ) return;

      const isClear = outcome === "clear";
      if (gameState === "running") captureGameElapsedTime(performance.now());
      gameState = "gameover";
      restoreGamePresentation();
      gameOverTitle.textContent = isClear ? "CLEAR" : "GAME OVER";
      const formattedScore = formatGameScore(gameScore);
      gameFinalScore.value = formattedScore;
      gameFinalScore.textContent = formattedScore;
      renderGameScoreHistory(saveGameScore(gameScore, gameElapsedMilliseconds));

      const shareUrl = new URL("https://twitter.com/intent/tweet");
      shareUrl.searchParams.set(
        "text",
        `AA BREAKOUT / ${isClear ? "CLEAR / " : ""}SCORE ${formattedScore}`,
      );
      shareUrl.searchParams.set("url", window.location.href);
      gameShare.href = shareUrl.href;
      profileStatus.textContent = isClear
        ? `Game cleared. Score ${gameScore}.`
        : `Game over. Score ${gameScore}.`;

      if (!gameOverDialog.open) gameOverDialog.showModal();
      gameReturn.focus({ preventScroll: true });
    };

    const returnFromGame = () => {
      if (gameState !== "gameover") return;

      if (gameOverDialog.open) gameOverDialog.close();
      gameState = "idle";
      profileStatus.textContent = "Returned to the character view.";

      const focusTarget = gameReturnFocus;
      gameReturnFocus = null;
      if (focusTarget?.isConnected && !focusTarget.hasAttribute("disabled")) {
        requestAnimationFrame(() => focusTarget.focus({ preventScroll: true }));
      }
    };

    gameReturn.addEventListener("click", returnFromGame);
    gameOverDialog.addEventListener("cancel", (event) => {
      event.preventDefault();
      returnFromGame();
    });
    gameResume.addEventListener("click", resumeGame);
    gameFinish.addEventListener("click", () => finishGame());
    gamePauseDialog.addEventListener("cancel", (event) => {
      event.preventDefault();
      resumeGame();
    });

    document.addEventListener("pointerdown", (event) => {
      if (gameState !== "running") return;
      setGamePaddleCenter(event.clientX);
      if (event.pointerType === "touch" && mobileGameInput.matches && event.isPrimary) {
        beginGameCharge(event.pointerId);
      }
    }, { passive: true });

    document.addEventListener("pointermove", (event) => {
      if (gameState !== "running" || !event.isPrimary) return;
      setGamePaddleCenter(event.clientX);
    }, { passive: true });

    window.addEventListener("pointerup", (event) => releaseGameCharge(event.pointerId), {
      passive: true,
    });
    window.addEventListener("pointercancel", (event) => {
      if (event.pointerId === gameChargePointerId) resetGameCharge();
    }, { passive: true });

    window.addEventListener("resize", () => {
      if (gameState === "idle" || gameState === "gameover") return;
      resizeGameLayer();
      updateGameRenderMetrics();
      setGamePaddleCenter(gamePaddleCenter);
      gameMemoryPickups.forEach((pickup) => {
        const halfWidth = pickup.width / 2;
        pickup.x = Math.max(
          halfWidth + 6,
          Math.min(window.innerWidth - halfWidth - 6, pickup.x),
        );
      });
    });

    const pointerAngle = (event) => {
      const bounds = spinner.getBoundingClientRect();

      return Math.atan2(
        event.clientY - (bounds.top + bounds.height / 2),
        event.clientX - (bounds.left + bounds.width / 2),
      );
    };

    const startBounce = () => {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      animationFrame = 0;
      targetRotation = originalRotationTarget();

      if (reducedMotion.matches) {
        angularVelocity = 0;
        rotation = targetRotation;
        render();
        return;
      }

      if (
        Math.abs(targetRotation - rotation) < 0.0008
        && Math.abs(angularVelocity) < 0.02
      ) {
        angularVelocity = 0;
        rotation = targetRotation;
        render();
        return;
      }

      let previousFrameTime = performance.now();

      const spin = (time) => {
        const elapsed = Math.min((time - previousFrameTime) / 1000, 0.032);
        const springForce = (targetRotation - rotation) * 30;
        const dampingForce = angularVelocity * 8.2;

        previousFrameTime = time;
        angularVelocity += (springForce - dampingForce) * elapsed;
        rotation += angularVelocity * elapsed;
        render();

        if (
          Math.abs(targetRotation - rotation) < 0.0008
          && Math.abs(angularVelocity) < 0.008
        ) {
          rotation = targetRotation;
          angularVelocity = 0;
          animationFrame = 0;
          render();
          return;
        }

        animationFrame = requestAnimationFrame(spin);
      };

      animationFrame = requestAnimationFrame(spin);
    };

    const finishDrag = (event, allowInertia) => {
      if (event.pointerId !== activePointerId) return;

      const releaseDelay = performance.now() - previousPointerTime;
      activePointerId = null;
      spinner.classList.remove("is-dragging");

      if (spinner.hasPointerCapture(event.pointerId)) {
        spinner.releasePointerCapture(event.pointerId);
      }

      if (!allowInertia || releaseDelay > 180) {
        angularVelocity = 0;
      } else {
        angularVelocity = Math.max(-18, Math.min(18, angularVelocity));
      }

      startBounce();
    };

    spinner.addEventListener("pointerdown", (event) => {
      if (profileVisible || profileTransitioning) return;
      if (!event.isPrimary || (event.pointerType === "mouse" && event.button !== 0)) return;

      stopMotion();
      activePointerId = event.pointerId;
      previousPointerAngle = pointerAngle(event);
      previousPointerTime = performance.now();
      spinner.classList.add("is-dragging");
      spinner.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    spinner.addEventListener("pointermove", (event) => {
      if (event.pointerId !== activePointerId) return;

      const currentTime = performance.now();
      const currentPointerAngle = pointerAngle(event);
      const angleDelta = normalizeAngle(currentPointerAngle - previousPointerAngle);
      const elapsed = Math.max((currentTime - previousPointerTime) / 1000, 1 / 120);
      const currentVelocity = angleDelta / elapsed;

      rotation += angleDelta;
      angularVelocity = angularVelocity * 0.68 + currentVelocity * 0.32;
      previousPointerAngle = currentPointerAngle;
      previousPointerTime = currentTime;
      render();
      event.preventDefault();
    });

    spinner.addEventListener("pointerup", (event) => finishDrag(event, true));
    spinner.addEventListener("pointercancel", (event) => finishDrag(event, false));
    spinner.addEventListener("lostpointercapture", (event) => finishDrag(event, false));

    spinner.addEventListener("keydown", (event) => {
      if (profileVisible || profileTransitioning) return;

      const direction = event.key === "ArrowLeft" || event.key === "ArrowUp"
        ? -1
        : event.key === "ArrowRight" || event.key === "ArrowDown"
          ? 1
          : 0;

      if (direction) {
        event.preventDefault();
        stopMotion();
        rotation += direction * (event.shiftKey ? Math.PI / 4 : Math.PI / 12);
        render();
        startBounce();
        return;
      }

      if (event.key === "Home") {
        event.preventDefault();
        stopMotion();
        rotation = 0;
        render();
        return;
      }

      if (event.key === "Enter" && !event.repeat) {
        event.preventDefault();

        angularVelocity = event.shiftKey ? -16 : 16;
        startBounce();
      }
    });

    profileLink.addEventListener("click", () => {
      morphProfile(!profileVisible);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === " ") {
        const target = event.target;
        const isEditable = target instanceof HTMLElement
          && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName));

        if (isEditable) return;
        event.preventDefault();
        if (event.repeat) return;

        if (gameState === "idle") {
          requestGameStart();
        } else if (gameState === "running") {
          beginGameCharge(GAME_KEYBOARD_CHARGE_ID);
        } else if (gameState === "gameover") {
          returnFromGame();
        }
        return;
      }

      if (
        gameState === "running"
        && (event.key === "ArrowLeft" || event.key === "ArrowRight")
      ) {
        event.preventDefault();
        gameMoveKeys.add(event.key);
        return;
      }

      if (event.key === "Escape" && !event.repeat) {
        if (gameState === "countdown" || gameState === "running") {
          event.preventDefault();
          pauseGame();
          return;
        }

        if (gameState === "paused") {
          event.preventDefault();
          resumeGame();
          return;
        }
      }

      if (event.key !== "Escape" || !profileVisible || profileTransitioning) return;

      event.preventDefault();
      morphProfile(false);
      profileLink.focus();
    });

    document.addEventListener("keyup", (event) => {
      if (event.key === " ") releaseGameCharge(GAME_KEYBOARD_CHARGE_ID);
      if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        gameMoveKeys.delete(event.key);
      }
    });

    reducedMotion.addEventListener("change", (event) => {
      if (event.matches) snapToOriginal();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) return;

      snapToOriginal();
      if (gameState === "countdown" || gameState === "running") {
        pauseGame();
        return;
      }
      gameMoveKeys.clear();
      if (gameChargePointerId === GAME_KEYBOARD_CHARGE_ID) resetGameCharge();
    });
  </script>
</body>
</html>
